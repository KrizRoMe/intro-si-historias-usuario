name: Historia de Usuario
description: Plantilla para registrar Historias de Usuario (HU) del curso Introducción a los Sistemas de Información.
title: "[HU-XX] "
labels:
  - user-story
body:
  - type: markdown
    attributes:
      value: |
        # Historia de Usuario
        Completa la descripción usando el formato `Como / Quiero / Para`.

  - type: textarea
    id: descripcion_hu
    attributes:
      label: Descripción de la Historia de Usuario
      description: Escribe la historia siguiendo el formato `Como [rol] quiero [acción] para [beneficio]`.
      placeholder: "Como cliente registrado del sistema quiero iniciar sesión con mi correo electrónico y contraseña para acceder a mi historial de pedidos."
    validations:
      required: true

  - type: textarea
    id: sistema_modulo
    attributes:
      label: Sistema o módulo
      description: Nombre del sistema, módulo o subsistema al que pertenece esta historia (texto libre).
      placeholder: "Sistema de citas / Portal del paciente / Módulo de autenticación"
    validations:
      required: true

  - type: checkboxes
    id: criterios_aceptacion
    attributes:
      label: Criterios de aceptación
      description: Marca todas las condiciones que debe cumplir esta historia para ser aceptada.
      options:
        - label: "El sistema debe validar que el correo tenga un formato válido."
          required: false
        - label: "Si la contraseña es incorrecta, debe mostrar un mensaje de error claro."
          required: false
        - label: 'Debe incluir un botón/enlace de "¿Olvidaste tu contraseña?".'
          required: false
        - label: "Al autenticarse con éxito, debe redirigir al usuario al panel principal."
          required: false
        - label: "La sesión debe expirar tras un período de inactividad."
          required: false

  - type: upload
    id: prototipo
    attributes:
      label: Prototipo / Wireframe
      description: Adjunta la imagen del boceto en Excalidraw u otra herramienta. PNG, JPG, GIF o SVG. Máximo 10 MB.
    validations:
      required: false
