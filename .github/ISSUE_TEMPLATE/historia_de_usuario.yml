name: Historia de Usuario
description: Plantilla para registrar Historias de Usuario (HU) del curso Introducción a los Sistemas de Información.
title: "[HU-XX] "
labels:
  - user-story
body:
  - type: markdown
    attributes:
      value: |
        # Historia de Usuario
        Completa la descripción usando el formato `Como / Quiero / Para`.

  - type: textarea
    id: integrantes_grupo
    attributes:
      label: Integrantes del grupo
      description: Lista los nombres completos y el código de cada integrante del equipo. Un nombre por línea en formato `Apellido, Nombre (código)`.
      placeholder: |
        Pérez Gómez, Juan Carlos (20211001)
        Ramírez López, Ana Lucía (20211002)
        Torres Vargas, Luis Miguel (20211003)
    validations:
      required: true

  - type: textarea
    id: descripcion_hu
    attributes:
      label: Descripción de la Historia de Usuario
      description: Escribe la historia siguiendo el formato `Como [rol] quiero [acción] para [beneficio]`.
      placeholder: "Como cliente registrado del sistema quiero iniciar sesión con mi correo electrónico y contraseña para acceder a mi historial de pedidos."
    validations:
      required: true

  - type: textarea
    id: sistema_modulo
    attributes:
      label: Sistema o módulo
      description: Nombre del sistema, módulo o subsistema al que pertenece esta historia (texto libre).
      placeholder: "Sistema de citas / Portal del paciente / Módulo de autenticación"
    validations:
      required: true

  - type: textarea
    id: criterio_1
    attributes:
      label: Criterio de aceptación 1
      description: Describe una condición medible que debe cumplirse para aceptar esta historia.
      placeholder: "El sistema debe validar que el correo tenga un formato válido."
    validations:
      required: true

  - type: textarea
    id: criterio_2
    attributes:
      label: Criterio de aceptación 2
      description: Segunda condición medible que debe cumplirse.
      placeholder: 'Si la contraseña es incorrecta, debe mostrar un mensaje de error claro y un enlace de "¿Olvidaste tu contraseña?".'
    validations:
      required: true

  - type: textarea
    id: criterio_3
    attributes:
      label: Criterio de aceptación 3
      description: Tercera condición medible que debe cumplirse.
      placeholder: "Al autenticarse con éxito, debe redirigir al usuario al panel principal y mantener la sesión activa hasta el cierre explícito."
    validations:
      required: true

  - type: upload
    id: prototipo
    attributes:
      label: Prototipo / Wireframe
      description: Adjunta la imagen del boceto en Excalidraw u otra herramienta. PNG, JPG, GIF o SVG. Máximo 10 MB.
    validations:
      required: false
